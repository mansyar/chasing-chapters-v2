name: CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck, Lint, Test, Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          # Credentials and db name mirror docker-compose.yml so CI matches the
          # local development database conventions.
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: chasing-chapters
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run database migrations
        # `echo y |` auto-accepts Payload's one-time dev-push drift prompt —
        # same pattern as deploy.yml. With a clean migration-managed DB
        # nothing reads stdin and this is a no-op. Required because
        # prerendering queries schema during `next build`.
        run: echo y | bun run payload migrate

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

      - name: Build
        env:
          # Same variable name as deploy.yml and src/lib/env.ts (the app reads
          # DATABASE_URI, not DATABASE_URL). Points at the postgres service
          # container above, which `next build` needs for prerendering.
          DATABASE_URI: postgresql://postgres:postgrespassword@localhost:5432/chasing-chapters
          # Placeholder values, not secrets: src/lib/env.ts validates these via
          # zod when payload.config loads during the build. The build performs
          # no real media operations, so dummy values satisfy validation while
          # keeping the workflow secret-free (NFR-3).
          PAYLOAD_SECRET: ci-build-only-placeholder-secret-32-chars-min
          R2_BUCKET: ci-build-bucket
          R2_ENDPOINT: https://ci-build-placeholder.invalid
          R2_ACCESS_KEY_ID: ci-build-placeholder-access-key
          R2_SECRET_ACCESS_KEY: ci-build-placeholder-secret-key
        run: bun run build
