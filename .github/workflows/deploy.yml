name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger

env:
  DOCKER_IMAGE: mansyar/chasing-chapters
  DOCKER_TAG: latest

jobs:
  # Migrations MUST run before the Docker build: `next build` performs static
  # generation against the production database, so new schema columns must
  # already exist or prerendering fails (42703). Migrations are additive and
  # backward-compatible with the currently deployed image, so applying them
  # first is safe even if the subsequent build fails.
  migrate:
    name: Run DB Migrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run database migrations
        # `echo y |` auto-accepts Payload's one-time dev-push drift prompt
        # (a `batch: -1` row in payload_migrations); with a clean
        # migration-managed DB nothing reads stdin and this is a no-op.
        env:
          DATABASE_URI: ${{ secrets.DATABASE_URI }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: echo y | bun run payload migrate

  build-and-push:
    name: Build and Push to Docker Hub
    runs-on: ubuntu-latest
    needs: migrate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
          build-args: |
            DATABASE_URI=${{ secrets.DATABASE_URI }}
            PAYLOAD_SECRET=${{ secrets.PAYLOAD_SECRET }}
            R2_BUCKET=${{ secrets.R2_BUCKET }}
            R2_ENDPOINT=${{ secrets.R2_ENDPOINT }}
            R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
            R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
            R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }}
            NEXT_PUBLIC_R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }}
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Trigger Coolify Deployment
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Trigger Coolify webhook
        run: |
          curl -X POST "${{ secrets.COOLIFY_WEBHOOK_URL }}" \
            -H "Accept: application/json" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_WEBHOOK_TOKEN }}" \
            --fail-with-body
